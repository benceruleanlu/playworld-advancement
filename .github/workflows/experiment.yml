name: experiment
# Shown in the Actions list and the API, so a run can be identified while it is still in progress.
run-name: "${{ inputs.exp }} · ${{ inputs.runner }} · ${{ inputs.tasks || inputs.split }} · ${{ inputs.action_source }}${{ inputs.action_source != 'dataset' && format(' · {0}', inputs.player_model) || '' }}${{ inputs.extra && format(' · {0}', inputs.extra) || '' }}${{ inputs.judge_model && format(' · judge {0}', inputs.judge_model) || '' }}${{ inputs.max_chunks && format(' · SMOKE capped {0} chunks', inputs.max_chunks) || '' }}${{ inputs.stage != 'full' && format(' · {0}', inputs.stage) || '' }}"

# Manual: Actions tab -> experiment -> Run workflow.
# backend=modal: generation runs on Modal GPUs (needs MODAL_TOKEN_ID/SECRET).
# backend=local: generation runs on this runner (no GPU; use runner=tests/fake_runner.py to test the pipeline).
# Scoring (Gemini) and reporting always run on this runner. The results/experiments.csv row is committed to main.

on:
  workflow_dispatch:
    inputs:
      exp:
        description: Experiment name (new name per run)
        required: true
      split:
        description: Task split
        type: choice
        options: [dev, heldout, all]
        default: dev
      tasks:
        description: Comma-separated task IDs (overrides split)
        default: ""
      runner:
        description: sana | matrix_game3 | lingbot_world2 | lingbot_world2_1p3b | path (tests/fake_runner.py for a pipeline test)
        default: sana
      action_source:
        type: choice
        options: [dataset, agent, refined]
        default: dataset
      backend:
        type: choice
        options: [modal, local]
        default: modal
      gpu:
        description: Modal GPU type
        type: choice
        options: [H100, A100-80GB, L40S]
        default: H100
      num_shards:
        description: Parallel GPUs on Modal
        default: "4"
      stage:
        type: choice
        options: [full, gen-only, score-only]
        default: full
      passes:
        description: Verifier passes
        default: "2"
      judge_model:
        description: "Screening judge for dev loops, e.g. gemini-4-hydrogen or gemini-4-hydrogen:low (thinking level). Empty = official judge. Never writes the results csv row."
        default: ""
      notes:
        default: ""
      extra:
        description: Extra runner args (Modal backend), e.g. --lingbot-stateless
        default: ""
      player_model:
        description: Player (agent) model for closed-loop runs; passed to the runner as --agent-model
        default: "gpt-6-luna"
      max_chunks:
        description: "Smoke tier: cap each closed-loop rollout at N agent chunks (official 30; upstream --num-chunks). Empty = uncapped. Capped runs are labelled smoke everywhere and never an official score."
        default: ""

concurrency:
  group: experiment-${{ inputs.exp }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXP: ${{ inputs.exp }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.1-pro-preview
  GOOGLE_GENAI_API_VERSION: v1beta
  PLAYER_API_PROVIDER: ${{ vars.PLAYER_API_PROVIDER || 'openai' }}
  PLAYER_API_URL: ${{ vars.PLAYER_API_URL || 'https://api.openai.com/v1' }}
  PLAYER_MODEL: ${{ vars.PLAYER_MODEL || 'gpt-4.1-mini' }}
  PLAYER_API_KEY: ${{ secrets.PLAYER_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  PWA_MODAL_GPU: ${{ inputs.gpu }}
  PWA_RUNNER: ${{ inputs.runner }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Validate experiment name
        env:
          JUDGE_IN: ${{ inputs.judge_model }}
          CAP_IN: ${{ inputs.max_chunks }}
          ACTION_SOURCE: ${{ inputs.action_source }}
        run: |
          [[ "$EXP" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "exp must match [A-Za-z0-9._-]+" >&2; exit 2; }
          # max_chunks: empty, or a positive integer for a closed-loop run; exported to later steps as MAX_CHUNKS
          if [[ -n "$CAP_IN" ]]; then
            [[ "$CAP_IN" =~ ^[1-9][0-9]*$ ]] || { echo "max_chunks must be empty or a positive integer" >&2; exit 2; }
            [[ "$ACTION_SOURCE" != "dataset" ]] || { echo "max_chunks caps closed-loop agent chunks; use action_source agent or refined" >&2; exit 2; }
            echo "MAX_CHUNKS=$CAP_IN" >> "$GITHUB_ENV"
            echo "::notice title=capped smoke run::$CAP_IN agent chunks per rollout (official 30); not comparable to official scores"
          fi
          # judge_model: MODEL or MODEL:THINKING (minimal|low|medium|high); exported to later steps as JUDGE_MODEL / JUDGE_THINKING
          [[ "$JUDGE_IN" =~ ^[A-Za-z0-9._:-]*$ ]] || { echo "judge_model must match [A-Za-z0-9._:-]*" >&2; exit 2; }
          if [[ -n "$JUDGE_IN" ]]; then
            model="${JUDGE_IN%%:*}"; thinking=""; [[ "$JUDGE_IN" == *:* ]] && thinking="${JUDGE_IN#*:}"
            [[ -n "$model" ]] || { echo "judge_model needs a model id" >&2; exit 2; }
            [[ -z "$thinking" || "$thinking" =~ ^(minimal|low|medium|high)$ ]] || { echo "judge thinking must be minimal|low|medium|high" >&2; exit 2; }
            { echo "JUDGE_MODEL=$model"; echo "JUDGE_THINKING=$thinking"; } >> "$GITHUB_ENV"
            echo "::notice title=screening judge::$JUDGE_IN (dev screening; no results csv row)"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check player API before generation
        if: inputs.action_source != 'dataset' && inputs.stage != 'score-only'
        env:
          PLAYER_MODEL: ${{ inputs.player_model }}  # check the model this run will use, so a bad id fails here
        run: |
          [[ "$PLAYER_MODEL" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "player_model must match [A-Za-z0-9._:-]+" >&2; exit 2; }
          timeout 30s python -m adapters.common.agent_api
      - name: Install FFmpeg
        # Every stage needs it: the verifier, and pwa media for the scenes. On a Modal gen-only run only the scenes
        # need it, and a failure there must not fail the job.
        continue-on-error: ${{ inputs.backend == 'modal' && inputs.stage == 'gen-only' }}
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Install dataset client
        run: pip install -q huggingface_hub
      - name: Install Modal CLI
        if: inputs.backend == 'modal'
        run: pip install -q modal
      - name: Install local rollout and verifier dependencies
        if: inputs.backend != 'modal' || inputs.stage != 'gen-only'
        run: |
          pip install -q -e third_party/PlayWorld
          pip install -q -r third_party/PlayWorld/Agent_player/SANA-WM/requirements.txt
          pip install -q -e .
      - name: Install pwa for scenes
        # Modal gen-only: the scenes step runs pwa media here (stdlib only, no verifier dependencies).
        if: inputs.backend == 'modal' && inputs.stage == 'gen-only'
        continue-on-error: true
        run: pip install -q -e .
      - uses: actions/cache@v4
        with:
          path: data
          key: playworld-bench-v1
      - name: Dataset
        run: |
          [[ -d data/gc/images ]] || python -I -c "from huggingface_hub import snapshot_download; snapshot_download('jocelynd/playworld-bench', repo_type='dataset', local_dir='data')"

      - name: Mark running on main
        # Visibility only: a score-less status=running row in main's results csv. Never blocks the run.
        # A score-only run sends no metadata: its inputs may be defaults, and the row keeps what generation recorded.
        continue-on-error: true
        env:
          LABEL: ${{ inputs.stage != 'score-only' && (inputs.tasks && 'custom' || inputs.split) || '' }}
          RUNNER: ${{ inputs.stage != 'score-only' && inputs.runner || '' }}
          ACTION_SOURCE: ${{ inputs.stage != 'score-only' && inputs.action_source || '' }}
          NOTES: ${{ inputs.stage != 'score-only' && inputs.notes || '' }}
          MARK_CAP: ${{ inputs.stage != 'score-only' && inputs.max_chunks || '' }}
        run: |
          echo "::notice title=experiment::$EXP runner=$RUNNER tasks=$LABEL action_source=$ACTION_SOURCE stage=${{ inputs.stage }}${MARK_CAP:+ max_chunks=$MARK_CAP}"
          .github/scripts/push_results.sh "results: $EXP running" \
            'python -m pwa.cli mark "$EXP" --status running --into "$MAIN_DIR/results/experiments.csv" --split="$LABEL" --runner="$RUNNER" --action-source="$ACTION_SOURCE" --notes="$NOTES" ${MARK_CAP:+--max-chunks "$MARK_CAP"}'

      - name: Sync Modal secret
        if: inputs.backend == 'modal' && inputs.stage != 'score-only'
        run: |
          modal secret create pwa --force \
            PLAYER_API_PROVIDER="$PLAYER_API_PROVIDER" PLAYER_API_URL="$PLAYER_API_URL" \
            PLAYER_MODEL="$PLAYER_MODEL" PLAYER_API_KEY="$PLAYER_API_KEY" HF_TOKEN="$HF_TOKEN" >/dev/null

      - name: Prefetch LingBot weights on CPU
        if: inputs.backend == 'modal' && inputs.stage != 'score-only' && startsWith(inputs.runner, 'lingbot')
        run: modal run prefetch_lingbot.py --variant "${{ inputs.runner == 'lingbot_world2_1p3b' && '1.3b' || '14b' }}"

      - name: Prefetch SANA weights on CPU
        if: inputs.backend == 'modal' && inputs.stage != 'score-only' && inputs.runner == 'sana'
        run: modal run prefetch_sana.py

      - name: Generate (Modal)
        if: inputs.backend == 'modal' && inputs.stage != 'score-only'
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          NOTES: ${{ inputs.notes }}
          EXTRA: ${{ inputs.extra }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
        run: |
          # The player model goes to the runner as an argument, not through the shared Modal secret, so
          # concurrent runs with different players cannot affect each other.
          if [[ "$ACTION_SOURCE" != "dataset" && "$EXTRA" != *"--agent-model"* ]]; then
            EXTRA="$EXTRA --agent-model $PLAYER_MODEL_IN"
          fi
          modal run --detach modal_app.py --exp "$EXP" --split "$SPLIT" --tasks "$TASKS" \
            --runner "$RUNNER" --action-source "$ACTION_SOURCE" --num-shards "$NUM_SHARDS" --notes "$NOTES" \
            --max-chunks "${MAX_CHUNKS:-0}" --extra="$EXTRA"

      - name: Generate (local)
        if: inputs.backend == 'local' && inputs.stage != 'score-only'
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NOTES: ${{ inputs.notes }}
        run: |
          sel=(--split "$SPLIT"); [[ -n "$TASKS" ]] && sel=(--tasks ${TASKS//,/ })
          pwa gen "$EXP" "${sel[@]}" --runner "$RUNNER" --action-source "$ACTION_SOURCE" --notes="$NOTES" \
            ${MAX_CHUNKS:+--max-chunks "$MAX_CHUNKS"}

      - name: Fetch rollouts from Modal
        if: inputs.backend == 'modal' && inputs.stage != 'gen-only'
        run: mkdir -p runs && modal volume get pwa-runs "/$EXP" runs/ --force

      - name: Fetch rollouts from Modal for scenes (gen-only)
        # gen-only skips scoring but still publishes the clips; a failure here never fails the job
        if: inputs.backend == 'modal' && inputs.stage == 'gen-only'
        continue-on-error: true
        run: mkdir -p runs && modal volume get pwa-runs "/$EXP" runs/ --force

      - name: Score
        if: inputs.stage != 'gen-only'
        env:
          PASSES: ${{ inputs.passes }}
        run: |
          judge=(); [[ -n "${JUDGE_MODEL:-}" ]] && judge=(--judge-model "$JUDGE_MODEL" ${JUDGE_THINKING:+--judge-thinking "$JUDGE_THINKING"})
          pwa score "$EXP" "${judge[@]}" --passes "$PASSES" --workers 6

      - name: Report
        if: inputs.stage != 'gen-only'
        run: |
          if [[ -n "${JUDGE_MODEL:-}" ]]; then
            # screening judge: report and all-task table to the summary and results/reports/EXP.<slug>.md, no csv row
            judge=(--judge-model "$JUDGE_MODEL" ${JUDGE_THINKING:+--judge-thinking "$JUDGE_THINKING"})
            pwa report "$EXP" "${judge[@]}" --md | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
            { echo; echo '### Tasks'; echo; pwa failures "$EXP" "${judge[@]}" --all --md; } | tee -a "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true
            slug=$(pwa report "$EXP" "${judge[@]}" --json | python -c 'import json, sys; print(json.load(sys.stdin)["judge"]["slug"])')
            echo "JUDGE_SLUG=$slug" >> "$GITHUB_ENV"
            exit 0
          fi
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          pwa report "$EXP" --md --site-url "$site" | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md"
          { echo; echo '### Failures'; echo; pwa failures "$EXP" --md; } >> "$GITHUB_STEP_SUMMARY" || true
          # Per-task verifier reasons for every task, committed to main as results/reports/EXP.md below.
          { echo; echo '### Tasks'; echo; pwa failures "$EXP" --all --md; } >> "$RUNNER_TEMP/report.md" || true

      - name: Publish scenes (GitHub Release run-EXP)
        # Small web copies of every rollout go to a release; the manifest the site reads is committed below.
        # Every run that generated videos publishes them: scored, gen-only, capped smoke and screening-judge runs
        # (the manifest labels the unofficial ones; screening scores are never published). Pipeline tests publish
        # nothing. A failure here must not lose the scored row, so it never fails the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          JUDGE_IN: ${{ inputs.judge_model }}
          RUNNER_IN: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
        run: |
          tag="run-$EXP"
          repo="https://github.com/$GITHUB_REPOSITORY"
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          out="$RUNNER_TEMP/media"
          [[ -d "runs/$EXP" ]] || { echo "no rollouts on this runner"; exit 0; }
          report_name="$EXP.md"; screening=()
          if [[ -n "$JUDGE_IN" && "$STAGE" != "gen-only" ]]; then report_name="$EXP.$JUDGE_SLUG.md"; screening=(--screening "$JUDGE_IN"); fi
          pwa media "$EXP" --out "$out" --base-url "$repo/releases/download/$tag/" --release-url "$repo/releases/tag/$tag" \
            --report-name "$report_name" --site-url "$site" "${screening[@]}"
          shopt -s nullglob
          files=("$out"/*.mp4 "$out"/*.jpg)
          # pipeline tests and runs without rollouts publish nothing (pwa media writes no clips for them)
          if (( ${#files[@]} == 0 )); then echo "no rollouts to publish"; rm -f "$out/$EXP.json"; exit 0; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file "$out/RELEASE_NOTES.md"
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Scenes: $EXP" \
              --notes-file "$out/RELEASE_NOTES.md" --latest=false
          fi
          # reached only if every upload above succeeded (bash -e); the commit step publishes the manifest only then
          touch "$out/.published"
          # every task with a play link, in the step summary and in the results/reports/ entry committed below
          if [[ "$STAGE" == "gen-only" ]]; then
            { echo "## $EXP (generated, not scored)"; echo
              echo "runner \`$RUNNER_IN\` | action source \`$ACTION_SOURCE\` | stage gen-only"; echo; } > "$RUNNER_TEMP/report.md"
          fi
          { echo; cat "$out/SCENES.md"; } | tee -a "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit screening report
        # Screening judge: results/reports/EXP.<slug>.md and the run's unscored scenes reach main; never the
        # results csv row, and never the screening scores in the scenes manifest.
        if: inputs.stage != 'gen-only' && inputs.judge_model != ''
        run: |
          .github/scripts/push_results.sh "results: $EXP screening $JUDGE_SLUG" '
            mkdir -p "$MAIN_DIR/results/reports"
            cp "$RUNNER_TEMP/report.md" "$MAIN_DIR/results/reports/$EXP.$JUDGE_SLUG.md"
            .github/scripts/scenes_to_main.sh || echo "::warning::scenes manifest not committed"'

      - name: Commit scenes (gen-only)
        # gen-only (including capped smoke runs): the scenes manifest and results/reports/EXP.md (task list with
        # play links) reach main. No csv row beyond the status marker. Never fails the job.
        if: inputs.stage == 'gen-only'
        continue-on-error: true
        run: |
          [[ -f "$RUNNER_TEMP/media/.published" ]] || { echo "no published scenes"; exit 0; }
          .github/scripts/push_results.sh "results: $EXP scenes" '
            mkdir -p "$MAIN_DIR/results/reports"
            cp "$RUNNER_TEMP/report.md" "$MAIN_DIR/results/reports/$EXP.md"
            .github/scripts/scenes_to_main.sh'

      - name: Commit experiment log
        if: inputs.stage != 'gen-only' && inputs.judge_model == ''
        run: |
          # Runs on any branch record their row and report on main, from a separate checkout of main, so no
          # branch code reaches main. The row replaces the status=running row written at launch.
          .github/scripts/push_results.sh "results: $EXP" '
            pwa upsert-row "$EXP" --into "$MAIN_DIR/results/experiments.csv"
            mkdir -p "$MAIN_DIR/results/reports"
            cp "$RUNNER_TEMP/report.md" "$MAIN_DIR/results/reports/$EXP.md"
            .github/scripts/scenes_to_main.sh || echo "::warning::scenes manifest not committed"'

      - name: Mark final status on main
        # gen-only or screening-judge success -> generated (no official score); a failed or cancelled job (any
        # stage) -> failed / cancelled. Only touches a row that still says running, so a scored row is never downgraded.
        if: always() && (job.status != 'success' || inputs.stage == 'gen-only' || inputs.judge_model != '')
        continue-on-error: true
        env:
          STATUS: ${{ job.status == 'success' && 'generated' || (job.status == 'cancelled' && 'cancelled' || 'failed') }}
        run: |
          .github/scripts/push_results.sh "results: $EXP $STATUS" \
            'python -m pwa.cli mark "$EXP" --status "$STATUS" --into "$MAIN_DIR/results/experiments.csv"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ inputs.exp }}
          path: runs/${{ inputs.exp }}
          retention-days: 14
          if-no-files-found: ignore
