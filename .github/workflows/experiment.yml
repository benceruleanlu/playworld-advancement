name: experiment
# Shown in the Actions list and the API, so a run can be identified while it is still in progress.
run-name: "${{ inputs.exp }} · ${{ inputs.runner }} · ${{ inputs.tasks || inputs.split }} · ${{ inputs.action_source }}${{ inputs.action_source != 'dataset' && format(' · {0}', inputs.player_model) || '' }}${{ inputs.extra && format(' · {0}', inputs.extra) || '' }}${{ inputs.judge_model && format(' · judge {0}', inputs.judge_model) || '' }}${{ inputs.max_chunks && format(' · SMOKE capped {0} chunks', inputs.max_chunks) || '' }}${{ inputs.stage != 'full' && format(' · {0}', inputs.stage) || '' }}"

# Manual: Actions tab -> experiment -> Run workflow.
# backend=modal: generation runs on Modal GPUs (needs MODAL_TOKEN_ID/SECRET).
# backend=local: generation runs on this runner (no GPU; use runner=tests/fake_runner.py to test the pipeline).
# Scoring (Gemini) and reporting always run on this runner. The results/experiments.csv row is committed to main.

on:
  workflow_dispatch:
    inputs:
      exp:
        description: Experiment name (new name per run)
        required: true
      split:
        description: Task split
        type: choice
        options: [dev, dev2, dev48, heldout, all]
        default: dev
      tasks:
        description: Comma-separated task IDs (overrides split)
        default: ""
      runner:
        description: sana | matrix_game3 | lingbot_world2 | lingbot_world2_1p3b | path (tests/fake_runner.py for a pipeline test)
        default: sana
      action_source:
        type: choice
        options: [dataset, agent, refined]
        default: dataset
      backend:
        type: choice
        options: [modal, local]
        default: modal
      gpu:
        description: Modal GPU type
        type: choice
        options: [H100, A100-80GB, L40S]
        default: H100
      cpu:
        description: "CPU cores requested per Modal GPU container (empty = Modal's default). CPU-side load and T5 work scale with it; see --lingbot-cpu-threads"
        default: ""
      num_shards:
        description: Parallel GPUs on Modal
        default: "4"
      stage:
        type: choice
        options: [full, gen-only, score-only]
        default: full
      passes:
        description: Verifier passes
        default: "2"
      judge_model:
        description: "Screening judge(s) for dev loops, comma-separated [openai:]MODEL[:minimal|low|medium|high], e.g. gemini-4-hydrogen:low,openai:gpt-6-luna. openai:gpt-4.1 = PROXY judge (key PLAYER_API_KEY unless JUDGE_API_KEY), its rows go to results/proxy_experiments.csv. Empty = official judge. Never writes the results csv row."
        default: ""
      notes:
        default: ""
      extra:
        description: Extra runner args (Modal backend), e.g. --lingbot-stateless
        default: ""
      player_model:
        description: Player (agent) model for closed-loop runs; passed to the runner as --agent-model
        default: "gpt-6-luna"
      max_chunks:
        description: "Smoke tier: cap each closed-loop rollout at N agent chunks (official 30; upstream --num-chunks). Empty = uncapped. Capped runs are labelled smoke everywhere and never an official score."
        default: ""

concurrency:
  group: experiment-${{ inputs.exp }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read  # screening runs fetch the official eval/ from an earlier run-EXP artifact for judge calibration

env:
  EXP: ${{ inputs.exp }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.1-pro-preview
  GOOGLE_GENAI_API_VERSION: v1beta
  PLAYER_API_PROVIDER: ${{ vars.PLAYER_API_PROVIDER || 'openai' }}
  PLAYER_API_URL: ${{ vars.PLAYER_API_URL || 'https://api.openai.com/v1' }}
  PLAYER_MODEL: ${{ vars.PLAYER_MODEL || 'gpt-4.1-mini' }}
  PLAYER_API_KEY: ${{ secrets.PLAYER_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  PWA_MODAL_GPU: ${{ inputs.gpu }}
  PWA_MODAL_CPU: ${{ inputs.cpu }}
  PWA_RUNNER: ${{ inputs.runner }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Validate experiment name
        env:
          JUDGE_IN: ${{ inputs.judge_model }}
          CAP_IN: ${{ inputs.max_chunks }}
          ACTION_SOURCE: ${{ inputs.action_source }}
        run: |
          [[ "$EXP" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "exp must match [A-Za-z0-9._-]+" >&2; exit 2; }
          # Time budget for the optional media steps (fetch, encode, upload): the job timeout-minutes (350) less a
          # 10-minute reserve for the commit, status-marker and artifact steps. Keep in step with timeout-minutes.
          echo "MEDIA_DEADLINE=$(( $(date +%s) + (350 - 10) * 60 ))" >> "$GITHUB_ENV"
          # max_chunks: empty, or a positive integer for a closed-loop run; exported to later steps as MAX_CHUNKS
          if [[ -n "$CAP_IN" ]]; then
            [[ "$CAP_IN" =~ ^[1-9][0-9]*$ ]] || { echo "max_chunks must be empty or a positive integer" >&2; exit 2; }
            [[ "$ACTION_SOURCE" != "dataset" ]] || { echo "max_chunks caps closed-loop agent chunks; use action_source agent or refined" >&2; exit 2; }
            echo "MAX_CHUNKS=$CAP_IN" >> "$GITHUB_ENV"
            echo "::notice title=capped smoke run::$CAP_IN agent chunks per rollout (official 30); not comparable to official scores"
          fi
          # judge_model: comma-separated [openai:|gemini:]MODEL[:minimal|low|medium|high]; exported to later steps
          # as JUDGE_SPECS (space-separated; each is one `pwa score|report --judge-model` value)
          JUDGE_IN="${JUDGE_IN// /}"
          [[ "$JUDGE_IN" =~ ^[A-Za-z0-9._:,-]*$ ]] || { echo "judge_model must match [A-Za-z0-9._:,-]*" >&2; exit 2; }
          if [[ -n "$JUDGE_IN" ]]; then
            specs=()
            IFS=',' read -ra items <<< "$JUDGE_IN"
            for raw in "${items[@]}"; do
              m="$raw"
              [[ "$m" =~ :(minimal|low|medium|high)$ ]] && m="${m%:*}"
              m="${m#openai:}"; m="${m#gemini:}"
              [[ "$m" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "judge_model entry '$raw' must be [openai:]MODEL[:minimal|low|medium|high] with MODEL in [A-Za-z0-9._-]" >&2; exit 2; }
              [[ " ${specs[*]} " != *" $raw "* ]] || { echo "judge_model lists '$raw' twice" >&2; exit 2; }
              specs+=("$raw")
            done
            (( ${#specs[@]} > 0 )) || { echo "judge_model has no entries" >&2; exit 2; }
            echo "JUDGE_SPECS=${specs[*]}" >> "$GITHUB_ENV"
            echo "::notice title=screening judge::${specs[*]} (dev screening; no results csv row)"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check player API before generation
        if: inputs.action_source != 'dataset' && inputs.stage != 'score-only'
        env:
          PLAYER_MODEL: ${{ inputs.player_model }}  # check the model this run will use, so a bad id fails here
        run: |
          [[ "$PLAYER_MODEL" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "player_model must match [A-Za-z0-9._:-]+" >&2; exit 2; }
          timeout 30s python -m adapters.common.agent_api
      - name: Install Python dependencies
        run: |
          pip install -q huggingface_hub ${{ inputs.backend == 'modal' && 'modal' || '' }}
          if [[ "${{ inputs.backend }}" != "modal" || "${{ inputs.stage }}" != "gen-only" ]]; then
            pip install -q -e third_party/PlayWorld
            pip install -q -r third_party/PlayWorld/Agent_player/SANA-WM/requirements.txt
            pip install -q -e .
          fi
      - name: Install pwa for scenes
        # Modal gen-only: the scenes step runs pwa media here (stdlib only, no verifier dependencies).
        if: inputs.backend == 'modal' && inputs.stage == 'gen-only'
        continue-on-error: true
        run: pip install -q -e .
      - name: Set up FFmpeg
        # The ubuntu-latest image does not ship ffmpeg. Scoring (upstream frame sampling: fps/scale/pad, JPEG) and pwa media
        # (libx264, thumbnail, +faststart) use the pinned static build from imageio-ffmpeg, as ci.yml does, instead of apt.
        # Every stage needs it: the verifier, and pwa media for the scenes. On a Modal gen-only run only the scenes
        # need it, and a failure there must not fail the job.
        continue-on-error: ${{ inputs.backend == 'modal' && inputs.stage == 'gen-only' }}
        run: |
          pip install -q --only-binary=:all: imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -hide_banner -encoders | grep ' libx264 ' >/dev/null ||{ echo "ffmpeg lacks libx264" >&2; exit 1; }
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: data
          key: playworld-bench-v1
      - name: Dataset
        run: |
          [[ -d data/gc/images ]] || python -I -c "from huggingface_hub import snapshot_download; snapshot_download('jocelynd/playworld-bench', repo_type='dataset', local_dir='data')"

      - name: Mark running on main
        # Visibility only: a score-less status=running row in main's results csv. Never blocks the run.
        # A score-only run sends no metadata: its inputs may be defaults, and the row keeps what generation recorded.
        continue-on-error: true
        env:
          LABEL: ${{ inputs.stage != 'score-only' && (inputs.tasks && 'custom' || inputs.split) || '' }}
          RUNNER: ${{ inputs.stage != 'score-only' && inputs.runner || '' }}
          ACTION_SOURCE: ${{ inputs.stage != 'score-only' && inputs.action_source || '' }}
          NOTES: ${{ inputs.stage != 'score-only' && inputs.notes || '' }}
          MARK_CAP: ${{ inputs.stage != 'score-only' && inputs.max_chunks || '' }}
          EXTRA: ${{ inputs.stage != 'score-only' && inputs.extra || '' }}
        run: |
          # a cap set through extra (--num-chunks N below upstream's 30) labels the running row too
          if [[ -z "$MARK_CAP" && -n "$EXTRA" ]]; then
            MARK_CAP=$(python -c 'import shlex, sys; from pwa.core import chunk_cap; print(chunk_cap({"runner_args": shlex.split(sys.argv[1])}) or "")' "$EXTRA" || true)
          fi
          echo "::notice title=experiment::$EXP runner=$RUNNER tasks=$LABEL action_source=$ACTION_SOURCE stage=${{ inputs.stage }}${MARK_CAP:+ max_chunks=$MARK_CAP}"
          .github/scripts/push_results.sh "results: $EXP running" \
            'python -m pwa.cli mark "$EXP" --status running --into "$MAIN_DIR/results/experiments.csv" --split="$LABEL" --runner="$RUNNER" --action-source="$ACTION_SOURCE" --notes="$NOTES" ${MARK_CAP:+--max-chunks "$MARK_CAP"}'

      - name: Sync Modal secret
        if: inputs.backend == 'modal' && inputs.stage != 'score-only'
        run: |
          modal secret create pwa --force \
            PLAYER_API_PROVIDER="$PLAYER_API_PROVIDER" PLAYER_API_URL="$PLAYER_API_URL" \
            PLAYER_MODEL="$PLAYER_MODEL" PLAYER_API_KEY="$PLAYER_API_KEY" HF_TOKEN="$HF_TOKEN" >/dev/null

      - name: Prefetch LingBot weights on CPU
        if: inputs.backend == 'modal' && inputs.stage != 'score-only' && startsWith(inputs.runner, 'lingbot')
        run: modal run prefetch_lingbot.py --variant "${{ inputs.runner == 'lingbot_world2_1p3b' && '1.3b' || '14b' }}"

      - name: Prefetch SANA weights on CPU
        if: inputs.backend == 'modal' && inputs.stage != 'score-only' && inputs.runner == 'sana'
        run: modal run prefetch_sana.py

      - name: Generate (Modal)
        if: inputs.backend == 'modal' && inputs.stage != 'score-only'
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          NOTES: ${{ inputs.notes }}
          EXTRA: ${{ inputs.extra }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
        run: |
          # The player model goes to the runner as an argument, not through the shared Modal secret, so
          # concurrent runs with different players cannot affect each other.
          if [[ "$ACTION_SOURCE" != "dataset" && "$EXTRA" != *"--agent-model"* ]]; then
            EXTRA="$EXTRA --agent-model $PLAYER_MODEL_IN"
          fi
          modal run --detach modal_app.py --exp "$EXP" --split "$SPLIT" --tasks "$TASKS" \
            --runner "$RUNNER" --action-source "$ACTION_SOURCE" --num-shards "$NUM_SHARDS" --notes "$NOTES" \
            --max-chunks "${MAX_CHUNKS:-0}" --extra="$EXTRA"

      - name: Generate (local)
        if: inputs.backend == 'local' && inputs.stage != 'score-only'
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NOTES: ${{ inputs.notes }}
        run: |
          sel=(--split "$SPLIT"); [[ -n "$TASKS" ]] && sel=(--tasks ${TASKS//,/ })
          pwa gen "$EXP" "${sel[@]}" --runner "$RUNNER" --action-source "$ACTION_SOURCE" --notes="$NOTES" \
            ${MAX_CHUNKS:+--max-chunks "$MAX_CHUNKS"}

      - name: Fetch rollouts from Modal
        if: inputs.backend == 'modal' && inputs.stage != 'gen-only'
        run: mkdir -p runs && modal volume get pwa-runs "/$EXP" runs/ --force

      - name: Fetch rollouts from Modal for scenes (gen-only)
        # gen-only skips scoring but still publishes the clips; a failure here never fails the job. Bounded by
        # MEDIA_DEADLINE so a long generation still ends inside the job timeout (the scenes are then skipped).
        if: inputs.backend == 'modal' && inputs.stage == 'gen-only'
        continue-on-error: true
        run: |
          left=$(( MEDIA_DEADLINE - $(date +%s) ))
          (( left > 120 )) || { echo "::warning::no time left in the job for scenes; skipped"; exit 0; }
          mkdir -p runs && timeout "$left" modal volume get pwa-runs "/$EXP" runs/ --force

      - name: Score
        if: inputs.stage != 'gen-only'
        env:
          PASSES: ${{ inputs.passes }}
          # openai: screening judges; empty falls back to PLAYER_API_KEY / PLAYER_API_URL (pwa/judge_openai.py)
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_API_URL: ${{ vars.JUDGE_API_URL }}
        run: |
          if [[ -z "${JUDGE_SPECS:-}" ]]; then
            pwa score "$EXP" --passes "$PASSES" --workers 6
            exit 0
          fi
          # screening judges in turn; one judge failing does not skip the next, but the step still fails at the end
          rc=0
          for spec in $JUDGE_SPECS; do
            pwa score "$EXP" --judge-model "$spec" --passes "$PASSES" --workers 6 || rc=1
          done
          exit "$rc"

      - name: Report
        if: inputs.stage != 'gen-only'
        env:
          GH_TOKEN: ${{ github.token }}  # the official-artifact lookup for judge calibration below calls gh api
        run: |
          # The run title only sees inputs; a score-only run of a capped generation gets its label from meta.json here.
          cap=$(python -c 'import sys; from pwa.core import chunk_cap, read_meta; print(chunk_cap(read_meta(sys.argv[1])) or "")' "$EXP" || true)
          [[ -z "$cap" ]] || echo "::notice title=capped smoke run::$EXP: $cap agent chunks per rollout (official 30); not comparable to official scores"
          if [[ -n "${JUDGE_SPECS:-}" ]]; then
            # screening judges: per judge, report + all-task table (+ calibration when official scores exist) to the
            # summary and $RUNNER_TEMP/screening/<slug>.md (committed as results/reports/EXP.<slug>.md); with two or
            # more, a panel table too. No csv row.
            if [[ ! -d "runs/$EXP/eval/pass1" ]]; then
              # best effort: the official eval/ of these videos from the newest unexpired run-EXP artifact holding one,
              # for this step only (deleted on exit, so Publish scenes still sees an unscored run)
              if ! ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=run-$EXP&per_page=20" \
                      --jq '.artifacts[] | select(.expired | not) | .id' 2>"$RUNNER_TEMP/gh.err"); then
                echo "::warning title=calibration lookup failed::artifact list for run-$EXP: $(head -c 300 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
                ids=""
              fi
              [[ -n "$ids" ]] || echo "no unexpired run-$EXP artifact found for calibration"
              for id in $ids; do
                if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/official.zip" 2>"$RUNNER_TEMP/gh.err"; then
                  echo "::warning title=calibration download failed::artifact $id: $(head -c 300 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
                  continue
                fi
                # list to a file, not a pipe into grep -q: an early grep exit would SIGPIPE unzip under pipefail
                unzip -Z1 "$RUNNER_TEMP/official.zip" > "$RUNNER_TEMP/official.ls" || true
                if grep -q '^eval/pass1/' "$RUNNER_TEMP/official.ls"; then
                  trap 'rm -rf "runs/$EXP/eval"' EXIT
                  unzip -qo "$RUNNER_TEMP/official.zip" 'eval/*' -d "runs/$EXP" && echo "official eval/ from artifact $id"
                  break
                fi
              done
              rm -f "$RUNNER_TEMP/official.zip"
            fi
            official=0; [[ -d "runs/$EXP/eval/pass1" ]] && official=1
            mkdir -p "$RUNNER_TEMP/screening"
            slugs=(); panel=()
            for spec in $JUDGE_SPECS; do
              slug=$(pwa report "$EXP" --judge-model "$spec" --json | python -c 'import json, sys; print(json.load(sys.stdin)["judge"]["slug"])')
              md="$RUNNER_TEMP/screening/$slug.md"
              pwa report "$EXP" --judge-model "$spec" --md > "$md" || true
              { echo; echo '### Tasks'; echo; pwa failures "$EXP" --judge-model "$spec" --all --md; } >> "$md" || true
              if (( official )); then { echo; pwa judges "$EXP" --judge-model "$spec" --md; } >> "$md" || true; fi
              cat "$md" >> "$GITHUB_STEP_SUMMARY"
              slugs+=("$slug"); panel+=(--judge-model "$spec")
            done
            if (( ${#slugs[@]} > 1 )); then
              { echo; pwa report "$EXP" "${panel[@]}" --md; } >> "$GITHUB_STEP_SUMMARY" || true
              if (( official )); then { echo; pwa judges "$EXP" "${panel[@]}" --md; } >> "$GITHUB_STEP_SUMMARY" || true; fi
            fi
            (( official )) || echo "No official eval/ for $EXP on this runner: calibration skipped." >> "$GITHUB_STEP_SUMMARY"
            # JUDGE_SLUG (first judge) names the report the Scenes manifest links to (publish_scenes.sh)
            { echo "JUDGE_SLUG=${slugs[0]}"; echo "JUDGE_SLUGS=${slugs[*]}"; } >> "$GITHUB_ENV"
            exit 0
          fi
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          pwa report "$EXP" --md --site-url "$site" | tee "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md"
          { echo; echo '### Failures'; echo; pwa failures "$EXP" --md; } >> "$GITHUB_STEP_SUMMARY" || true
          # Per-task verifier reasons for every task, committed to main as results/reports/EXP.md below.
          { echo; echo '### Tasks'; echo; pwa failures "$EXP" --all --md; } >> "$RUNNER_TEMP/report.md" || true

      - name: Publish scenes (GitHub Release run-EXP)
        # Small web copies of every rollout go to a release; the manifest the site reads is committed below.
        # Every run that generated videos publishes them: scored, gen-only, capped smoke and screening-judge runs
        # (the manifest labels the unofficial ones; screening scores are never published). An unscored run never
        # replaces official scenes already on main for the same EXP. Pipeline tests publish nothing. Bounded by
        # MEDIA_DEADLINE, and a failure here must not lose the scored row, so it never fails the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          JUDGE_IN: ${{ inputs.judge_model }}
          RUNNER_IN: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
        run: |
          left=$(( MEDIA_DEADLINE - $(date +%s) ))
          (( left > 120 )) || { echo "::warning::no time left in the job for scenes; skipped"; exit 0; }
          timeout "$left" .github/scripts/publish_scenes.sh

      - name: Drop fetched rollouts (Modal gen-only)
        # They were fetched only for the scenes; the artifact of a Modal gen-only run stays empty, as before.
        if: always() && inputs.backend == 'modal' && inputs.stage == 'gen-only'
        continue-on-error: true
        run: rm -rf "runs/$EXP"

      - name: Commit screening report
        # Screening judge: results/reports/EXP.<slug>.md and the run's unscored scenes reach main; never the
        # results csv row, and never the screening scores in the scenes manifest. An openai: (proxy) judge also
        # records its rows in results/proxy_experiments.csv, which the site does not read.
        if: inputs.stage != 'gen-only' && inputs.judge_model != ''
        run: |
          .github/scripts/push_results.sh "results: $EXP screening $JUDGE_SLUGS" '
            if [[ " $JUDGE_SLUGS" == *" openai-"* ]]; then
              pwa upsert-row "$EXP" --proxy --into "$MAIN_DIR/results/proxy_experiments.csv" \
                || echo "::warning::proxy csv row not committed"
            fi
            mkdir -p "$MAIN_DIR/results/reports"
            for slug in $JUDGE_SLUGS; do
              dest="$MAIN_DIR/results/reports/$EXP.$slug.md"
              cp "$RUNNER_TEMP/screening/$slug.md" "$dest"
              # the play links publish_scenes.sh wrote, only when every clip was uploaded
              if [[ -f "$RUNNER_TEMP/media/.published" && -f "$RUNNER_TEMP/media/SCENES.md" ]]; then
                { echo; cat "$RUNNER_TEMP/media/SCENES.md"; } >> "$dest"
              fi
            done
            .github/scripts/scenes_to_main.sh || echo "::warning::scenes manifest not committed"'

      - name: Commit scenes (gen-only)
        # gen-only (including capped smoke runs): the scenes manifest and results/reports/EXP.md (task list with
        # play links) reach main. No csv row beyond the status marker. Never fails the job.
        if: inputs.stage == 'gen-only'
        continue-on-error: true
        run: |
          [[ -f "$RUNNER_TEMP/media/.published" ]] || { echo "no published scenes"; exit 0; }
          .github/scripts/push_results.sh "results: $EXP scenes" '
            mkdir -p "$MAIN_DIR/results/reports"
            cp "$RUNNER_TEMP/report.md" "$MAIN_DIR/results/reports/$EXP.md"
            .github/scripts/scenes_to_main.sh'

      - name: Commit experiment log
        if: inputs.stage != 'gen-only' && inputs.judge_model == ''
        run: |
          # Runs on any branch record their row and report on main, from a separate checkout of main, so no
          # branch code reaches main. The row replaces the status=running row written at launch.
          .github/scripts/push_results.sh "results: $EXP" '
            pwa upsert-row "$EXP" --into "$MAIN_DIR/results/experiments.csv"
            mkdir -p "$MAIN_DIR/results/reports"
            cp "$RUNNER_TEMP/report.md" "$MAIN_DIR/results/reports/$EXP.md"
            .github/scripts/scenes_to_main.sh || echo "::warning::scenes manifest not committed"'

      - name: Mark final status on main
        # gen-only or screening-judge success -> generated (no official score); a failed or cancelled job (any
        # stage) -> failed / cancelled. Only touches a row that still says running, so a scored row is never downgraded.
        if: always() && (job.status != 'success' || inputs.stage == 'gen-only' || inputs.judge_model != '')
        continue-on-error: true
        env:
          STATUS: ${{ job.status == 'success' && 'generated' || (job.status == 'cancelled' && 'cancelled' || 'failed') }}
        run: |
          .github/scripts/push_results.sh "results: $EXP $STATUS" \
            'python -m pwa.cli mark "$EXP" --status "$STATUS" --into "$MAIN_DIR/results/experiments.csv"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ inputs.exp }}
          path: runs/${{ inputs.exp }}
          retention-days: 14
          if-no-files-found: ignore
