name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up FFmpeg
        run: |
          pip install -q --only-binary=:all: imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - run: |
          pip install -q -e third_party/PlayWorld huggingface_hub pytest
          pip install -q -r third_party/PlayWorld/Agent_player/SANA-WM/requirements.txt
          pip install -q -e .
      - name: Dataset metadata (json only)
        run: python -I -c "from huggingface_hub import snapshot_download; snapshot_download('jocelynd/playworld-bench', repo_type='dataset', local_dir='data', allow_patterns=['*.json'])"
      - run: python -m pytest -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the Astro results site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          mkdir -p public
          cp ../results/experiments.csv public/experiments.csv
          node src/scripts/runinfo.check.mjs
          node src/scripts/pairs.check.mjs
          node src/scripts/review.check.mjs
          npm run build
          test -s dist/index.html
          test -s dist/review/index.html
