name: arms
# Several arms (runner arg strings) on one small task list, generated back to back in one Modal GPU container
# per shard (`pwa gen-arms`), so the model load and first-chunk warm-up are paid once. Arm i is an ordinary
# experiment named EXP-a<i>. After generation each arm's clips are published to a release run-EXP-a<i>
# (linked from the step summary) and an `experiment` run with stage=score-only is dispatched per arm, which
# scores, reports, publishes scenes and records the csv row exactly like any other run.
# Manual: Actions tab -> arms -> Run workflow. Needs a runner with main(argv): lingbot_world2 or lingbot_world2_1p3b.
# warm=on generates on the deployed Modal app playworld-warm (warm_app.py, pwa/warm.py) instead of an ephemeral
# app, so a container that is still up from an earlier warm run skips the model load and first-step warm-up.
# Each warm container bills the GPU rate for up to warm_idle_minutes after its last call; warm=stop ends them now.
run-name: "${{ inputs.warm == 'stop' && 'warm stop' || format('arms {0} · {1} · {2} · {3} · {4}{5}{6}', inputs.exp, inputs.runner, inputs.tasks || inputs.split, inputs.action_source, inputs.arms, inputs.stage != 'full' && format(' · {0}', inputs.stage) || '', inputs.warm == 'on' && ' · warm' || '') }}"

on:
  workflow_dispatch:
    inputs:
      exp:
        description: Arm group name; arm i is experiment EXP-a<i> (new name per run)
        required: true
      arms:
        description: "'|'-separated runner arg strings, one per arm; an empty one or 'base' is the baseline, e.g. 'base | --lingbot-turn-cal --lingbot-player-hint'"
        required: true
      tasks:
        description: Comma-separated task IDs (overrides split)
        default: "GC005"
      split:
        type: choice
        options: [dev, heldout, all]
        default: dev
      runner:
        type: choice
        options: [lingbot_world2_1p3b, lingbot_world2]
        default: lingbot_world2_1p3b
      action_source:
        type: choice
        options: [dataset, agent, refined]
        default: agent
      gpu:
        description: Modal GPU type
        type: choice
        options: [H100, A100-80GB, L40S]
        default: H100
      num_shards:
        description: GPU containers; each runs every arm on its share of the tasks
        default: "1"
      stage:
        description: full = generate, publish clips, then dispatch one score-only experiment run per arm
        type: choice
        options: [full, gen-only]
        default: full
      passes:
        description: Verifier passes (passed to each score-only run)
        default: "2"
      judge_model:
        description: Screening judge for the score-only runs (see experiment.yml); empty = official judge
        default: ""
      notes:
        default: ""
      extra:
        description: Runner args for every arm, before the arm's own
        default: ""
      player_model:
        description: Player (agent) model for closed-loop runs; passed to the runner as --agent-model
        default: "gpt-6-luna"
      warm:
        description: "off = ephemeral app (default). on = deployed warm app; containers stay up warm_idle_minutes after the last call and bill the GPU the whole time. stop = terminate warm containers now (other inputs ignored)"
        type: choice
        options: ["off", "on", "stop"]
        default: "off"
      warm_idle_minutes:
        description: "warm=on: idle window per container before it scales down (1-20; a change redeploys, cold)"
        default: "10"
      warm_max_containers:
        description: "warm=on: max warm containers per runner (1-8; a change redeploys, cold)"
        default: "3"

concurrency:
  group: arms-${{ inputs.exp }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  EXP: ${{ inputs.exp }}
  ARMS: ${{ inputs.arms }}
  PLAYER_API_PROVIDER: ${{ vars.PLAYER_API_PROVIDER || 'openai' }}
  PLAYER_API_URL: ${{ vars.PLAYER_API_URL || 'https://api.openai.com/v1' }}
  PLAYER_MODEL: ${{ vars.PLAYER_MODEL || 'gpt-4.1-mini' }}
  PLAYER_API_KEY: ${{ secrets.PLAYER_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  PWA_MODAL_GPU: ${{ inputs.gpu }}
  PWA_RUNNER: ${{ inputs.runner }}
  MODAL_VERSION: "1.6.4"  # warm path only: the version pwa/warm.py and warm_app.py were checked against

jobs:
  stop-warm:
    if: inputs.warm == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Stop the warm app
        run: |
          pip install -q "modal==$MODAL_VERSION"
          python -m pwa.warm stop
          echo "Stopped Modal app \`playworld-warm\` (warm containers terminated)." >> "$GITHUB_STEP_SUMMARY"

  run:
    if: inputs.warm != 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate names and list arms
        env:
          WARM: ${{ inputs.warm }}
          WARM_IDLE: ${{ inputs.warm_idle_minutes }}
          WARM_MAX: ${{ inputs.warm_max_containers }}
        run: |
          [[ "$EXP" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "exp must match [A-Za-z0-9._-]+" >&2; exit 2; }
          if [[ "$WARM" == on ]]; then
            [[ "$WARM_IDLE" =~ ^[0-9]+$ ]] && (( WARM_IDLE >= 1 && WARM_IDLE <= 20 )) || { echo "warm_idle_minutes must be 1-20" >&2; exit 2; }
            [[ "$WARM_MAX" =~ ^[0-9]+$ ]] && (( WARM_MAX >= 1 && WARM_MAX <= 8 )) || { echo "warm_max_containers must be 1-8" >&2; exit 2; }
          fi
          # One "NAME I/N LABEL" line per arm (the names pwa gen-arms and modal_app.py use; LABEL is "base"
          # for an arm without args). Fails here if an arm does not parse.
          python -m pwa.arms "$EXP" "$ARMS" > "$RUNNER_TEMP/arms.txt"
          cat "$RUNNER_TEMP/arms.txt"
          echo "ARM_EXPS=$(cut -d' ' -f1 "$RUNNER_TEMP/arms.txt" | xargs)" >> "$GITHUB_ENV"
      - name: Check player API before generation
        if: inputs.action_source != 'dataset'
        env:
          PLAYER_MODEL: ${{ inputs.player_model }}
        run: |
          [[ "$PLAYER_MODEL" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "player_model must match [A-Za-z0-9._:-]+" >&2; exit 2; }
          timeout 30s python -m adapters.common.agent_api
      - name: Install FFmpeg, Modal CLI and pwa
        env:
          WARM: ${{ inputs.warm }}
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          if [[ "$WARM" == on ]]; then modal_req="modal==$MODAL_VERSION"; else modal_req=modal; fi
          pip install -q "$modal_req" huggingface_hub
          pip install -q -e .
      - uses: actions/cache@v4
        with:
          path: data
          key: playworld-bench-v1
      - name: Dataset
        run: |
          [[ -d data/gc/images ]] || python -I -c "from huggingface_hub import snapshot_download; snapshot_download('jocelynd/playworld-bench', repo_type='dataset', local_dir='data')"

      - name: Mark arms running on main
        continue-on-error: true
        env:
          LABEL: ${{ inputs.tasks && 'custom' || inputs.split }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NOTES: ${{ inputs.notes }}
        run: |
          .github/scripts/push_results.sh "results: $EXP arms running" '
            while read -r name idx spec <&3; do
              python -m pwa.cli mark "$name" --status running --into "$MAIN_DIR/results/experiments.csv" \
                --split="$LABEL" --runner="$RUNNER" --action-source="$ACTION_SOURCE" \
                --notes="${NOTES:+$NOTES }[arm $idx of $EXP: $spec]"
            done 3< "$RUNNER_TEMP/arms.txt"'

      - name: Sync Modal secret
        run: |
          modal secret create pwa --force \
            PLAYER_API_PROVIDER="$PLAYER_API_PROVIDER" PLAYER_API_URL="$PLAYER_API_URL" \
            PLAYER_MODEL="$PLAYER_MODEL" PLAYER_API_KEY="$PLAYER_API_KEY" HF_TOKEN="$HF_TOKEN" >/dev/null

      - name: Prefetch LingBot weights on CPU
        run: modal run prefetch_lingbot.py --variant "${{ inputs.runner == 'lingbot_world2_1p3b' && '1.3b' || '14b' }}"

      - name: Generate all arms (Modal)
        if: inputs.warm != 'on'
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          NOTES: ${{ inputs.notes }}
          EXTRA: ${{ inputs.extra }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
        run: |
          if [[ "$ACTION_SOURCE" != "dataset" && "$EXTRA" != *"--agent-model"* ]]; then
            EXTRA="$EXTRA --agent-model $PLAYER_MODEL_IN"
          fi
          modal run --detach modal_app.py --exp "$EXP" --split "$SPLIT" --tasks "$TASKS" \
            --runner "$RUNNER" --action-source "$ACTION_SOURCE" --num-shards "$NUM_SHARDS" --notes "$NOTES" \
            --extra="$EXTRA" --arms="$ARMS"

      - name: Generate all arms (warm Modal app)
        if: inputs.warm == 'on'
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          NOTES: ${{ inputs.notes }}
          EXTRA: ${{ inputs.extra }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
          PWA_WARM_IDLE_MIN: ${{ inputs.warm_idle_minutes }}
          PWA_WARM_MAX_CONTAINERS: ${{ inputs.warm_max_containers }}
        run: |
          [[ "$NUM_SHARDS" =~ ^[0-9]+$ ]] || { echo "num_shards must be a number" >&2; exit 2; }
          if [[ "$ACTION_SOURCE" != "dataset" && "$EXTRA" != *"--agent-model"* ]]; then
            EXTRA="$EXTRA --agent-model $PLAYER_MODEL_IN"
          fi
          # Deploys warm_app.py first if this commit or the warm settings differ from the deployed app
          # (that call starts cold), then one call per shard; prints one JSON result per shard.
          python -m pwa.warm run --exp "$EXP" --arms="$ARMS" --runner "$RUNNER" --action-source "$ACTION_SOURCE" \
            --tasks="$TASKS" --split="$SPLIT" --num-shards "$NUM_SHARDS" --notes="$NOTES" --extra="$EXTRA" \
            --summary "$RUNNER_TEMP/warm.json"
      - name: Warm container summary
        if: always() && inputs.warm == 'on'
        continue-on-error: true
        env:
          IDLE: ${{ inputs.warm_idle_minutes }}
        run: |
          [[ -f "$RUNNER_TEMP/warm.json" ]] || exit 0
          python - "$RUNNER_TEMP/warm.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("### Warm containers\n")
          print(f"Deployed this run: {'yes (cold start)' if d['deployed'] else 'no'}; wall clock {d['wall_s']} s\n")
          print("| Shard | Container call | Warm | Pipe load at enter (s) | Call (s) | rc |\n|---|---|---|---|---|---|")
          for r in d["shards"]:
              print(f"| {r['shard']} | {r['call']} | {r['warm']} | {r['pipe_loaded_in_s']} | {r.get('seconds', '')} | {r['rc']} |")
          PY
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Idle warm containers bill the GPU for up to $IDLE min after their last call. Stop them now: run this workflow with warm=stop." >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch arms from Modal
        run: |
          mkdir -p runs
          for name in $ARM_EXPS; do modal volume get pwa-runs "/$name" runs/ --force; done

      - name: Publish arm videos (GitHub Releases run-EXP-aN)
        # Unscored clips, right after generation, so every arm can be watched before (or without) scoring.
        # The score-only experiment run later uploads to the same release with --clobber.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="https://github.com/$GITHUB_REPOSITORY"
          { echo "### Arm videos"; echo; echo "| Arm | Args | Task | Video | Poster |"; echo "|---|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          while read -r name idx spec <&3; do
            tag="run-$name"; out="$RUNNER_TEMP/media/$name"
            pwa media "$name" --out "$out" --base-url "$repo/releases/download/$tag/" --release-url "$repo/releases/tag/$tag"
            shopt -s nullglob
            files=("$out"/*.mp4 "$out"/*.jpg)
            if (( ${#files[@]} == 0 )); then echo "$name: no rollouts to publish"; continue; fi
            { echo "Unscored clips from arm $idx of \`$EXP\` (\`$spec\`); a score-only experiment run adds the scores."; echo; cat "$out/RELEASE_NOTES.md"; } > "$out/NOTES.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Scenes: $name" \
                --notes-file "$out/NOTES.md" --latest=false
            fi
            for mp4 in "$out"/*.mp4; do
              tid=$(basename "$mp4" .mp4)
              echo "| $name | \`$spec\` | $tid | [mp4]($repo/releases/download/$tag/$tid.mp4) | [jpg]($repo/releases/download/$tag/$tid.jpg) |" >> "$GITHUB_STEP_SUMMARY"
            done
          done 3< "$RUNNER_TEMP/arms.txt"

      - name: Dispatch one score-only experiment run per arm
        if: inputs.stage == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          PASSES: ${{ inputs.passes }}
          JUDGE: ${{ inputs.judge_model }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
          GPU: ${{ inputs.gpu }}
        run: |
          while read -r name idx spec <&3; do
            [[ "$spec" == base ]] && spec=""
            # extra only labels the run title here; a score-only run generates nothing
            gh workflow run experiment.yml --ref "$GITHUB_REF_NAME" -f exp="$name" -f stage=score-only \
              -f backend=modal -f split="$SPLIT" -f tasks="$TASKS" -f runner="$RUNNER" -f action_source="$ACTION_SOURCE" \
              -f passes="$PASSES" -f judge_model="$JUDGE" -f player_model="$PLAYER_MODEL_IN" -f gpu="$GPU" -f extra="$spec"
            echo "dispatched score-only run for $name (arm $idx)"
            sleep 2
          done 3< "$RUNNER_TEMP/arms.txt"
          echo "Scoring: one \`experiment\` run per arm (${ARM_EXPS}) in the Actions list." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark final status on main
        # gen-only success -> generated; failed or cancelled -> failed / cancelled. A full run that succeeded
        # leaves the rows running: each score-only experiment run sets them. Only rows still running change.
        if: always() && (job.status != 'success' || inputs.stage == 'gen-only')
        continue-on-error: true
        env:
          STATUS: ${{ job.status == 'success' && 'generated' || (job.status == 'cancelled' && 'cancelled' || 'failed') }}
        run: |
          .github/scripts/push_results.sh "results: $EXP arms $STATUS" '
            for name in $ARM_EXPS; do
              python -m pwa.cli mark "$name" --status "$STATUS" --into "$MAIN_DIR/results/experiments.csv"
            done'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arms-${{ inputs.exp }}
          path: runs/${{ inputs.exp }}-a*
          retention-days: 14
          if-no-files-found: ignore
