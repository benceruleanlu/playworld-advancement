name: arms
# Several arms (runner arg strings) on one small task list, generated back to back in one Modal GPU container
# per shard (`pwa gen-arms`), so the model load and first-chunk warm-up are paid once. Arm i is an ordinary
# experiment named EXP-a<i>. After generation each arm's clips are published to a release run-EXP-a<i>
# (linked from the step summary) and an `experiment` run with stage=score-only is dispatched per arm, which
# scores, reports, publishes scenes and records the csv row exactly like any other run.
# Manual: Actions tab -> arms -> Run workflow. Needs a runner with main(argv): lingbot_world2 or lingbot_world2_1p3b.
run-name: "arms ${{ inputs.exp }} · ${{ inputs.runner }} · ${{ inputs.tasks || inputs.split }} · ${{ inputs.action_source }} · ${{ inputs.arms }}${{ inputs.stage != 'full' && format(' · {0}', inputs.stage) || '' }}"

on:
  workflow_dispatch:
    inputs:
      exp:
        description: Arm group name; arm i is experiment EXP-a<i> (new name per run)
        required: true
      arms:
        description: "'|'-separated runner arg strings, one per arm; an empty one is the baseline, e.g. ' | --lingbot-turn-cal --lingbot-player-hint'"
        required: true
      tasks:
        description: Comma-separated task IDs (overrides split)
        default: "GC005"
      split:
        type: choice
        options: [dev, heldout, all]
        default: dev
      runner:
        type: choice
        options: [lingbot_world2_1p3b, lingbot_world2]
        default: lingbot_world2_1p3b
      action_source:
        type: choice
        options: [dataset, agent, refined]
        default: agent
      gpu:
        description: Modal GPU type
        type: choice
        options: [H100, A100-80GB, L40S]
        default: H100
      num_shards:
        description: GPU containers; each runs every arm on its share of the tasks
        default: "1"
      stage:
        description: full = generate, publish clips, then dispatch one score-only experiment run per arm
        type: choice
        options: [full, gen-only]
        default: full
      passes:
        description: Verifier passes (passed to each score-only run)
        default: "2"
      judge_model:
        description: Screening judge for the score-only runs (see experiment.yml); empty = official judge
        default: ""
      notes:
        default: ""
      extra:
        description: Runner args for every arm, before the arm's own
        default: ""
      player_model:
        description: Player (agent) model for closed-loop runs; passed to the runner as --agent-model
        default: "gpt-6-luna"

concurrency:
  group: arms-${{ inputs.exp }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  EXP: ${{ inputs.exp }}
  ARMS: ${{ inputs.arms }}
  PLAYER_API_PROVIDER: ${{ vars.PLAYER_API_PROVIDER || 'openai' }}
  PLAYER_API_URL: ${{ vars.PLAYER_API_URL || 'https://api.openai.com/v1' }}
  PLAYER_MODEL: ${{ vars.PLAYER_MODEL || 'gpt-4.1-mini' }}
  PLAYER_API_KEY: ${{ secrets.PLAYER_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  PWA_MODAL_GPU: ${{ inputs.gpu }}
  PWA_RUNNER: ${{ inputs.runner }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate names and list arms
        env:
          EXTRA: ${{ inputs.extra }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
        run: |
          [[ "$EXP" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "exp must match [A-Za-z0-9._-]+" >&2; exit 2; }
          [[ "$EXTRA$ARMS" != *$'\n'* ]] || { echo "extra and arms must be one line" >&2; exit 2; }
          # The args every arm gets, computed once so the labels below match what gen-arms runs.
          if [[ "$ACTION_SOURCE" != "dataset" && "$EXTRA" != *"--agent-model"* ]]; then
            EXTRA="$EXTRA --agent-model $PLAYER_MODEL_IN"
          fi
          { echo "ARMS_EXTRA<<__PWA_EOF__"; echo "$EXTRA"; echo "__PWA_EOF__"; } >> "$GITHUB_ENV"
          # One "NAME I/N LABEL" line per arm (the names pwa gen-arms and modal_app.py use). LABEL is every arg the
          # arm runs with, shared extra first ("base" only if there are none). Fails here if an arm does not parse.
          python -m pwa.arms "$EXP" "$ARMS" "$EXTRA" > "$RUNNER_TEMP/arms.txt"
          cat "$RUNNER_TEMP/arms.txt"
          echo "ARM_EXPS=$(cut -d' ' -f1 "$RUNNER_TEMP/arms.txt" | xargs)" >> "$GITHUB_ENV"
      - name: Check player API before generation
        if: inputs.action_source != 'dataset'
        env:
          PLAYER_MODEL: ${{ inputs.player_model }}
        run: |
          [[ "$PLAYER_MODEL" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "player_model must match [A-Za-z0-9._:-]+" >&2; exit 2; }
          timeout 30s python -m adapters.common.agent_api
      - name: Install FFmpeg, Modal CLI and pwa
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -q modal huggingface_hub
          pip install -q -e .
      - uses: actions/cache@v4
        with:
          path: data
          key: playworld-bench-v1
      - name: Dataset
        run: |
          [[ -d data/gc/images ]] || python -I -c "from huggingface_hub import snapshot_download; snapshot_download('jocelynd/playworld-bench', repo_type='dataset', local_dir='data')"

      - name: Mark arms running on main
        continue-on-error: true
        env:
          LABEL: ${{ inputs.tasks && 'custom' || inputs.split }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NOTES: ${{ inputs.notes }}
        run: |
          .github/scripts/push_results.sh "results: $EXP arms running" '
            while read -r name idx spec <&3; do
              python -m pwa.cli mark "$name" --status running --into "$MAIN_DIR/results/experiments.csv" \
                --split="$LABEL" --runner="$RUNNER" --action-source="$ACTION_SOURCE" \
                --notes="${NOTES:+$NOTES }[arm $idx of $EXP: $spec]"
            done 3< "$RUNNER_TEMP/arms.txt"'

      - name: Sync Modal secret
        run: |
          modal secret create pwa --force \
            PLAYER_API_PROVIDER="$PLAYER_API_PROVIDER" PLAYER_API_URL="$PLAYER_API_URL" \
            PLAYER_MODEL="$PLAYER_MODEL" PLAYER_API_KEY="$PLAYER_API_KEY" HF_TOKEN="$HF_TOKEN" >/dev/null

      - name: Prefetch LingBot weights on CPU
        run: modal run prefetch_lingbot.py --variant "${{ inputs.runner == 'lingbot_world2_1p3b' && '1.3b' || '14b' }}"

      - name: Generate all arms (Modal)
        id: gen
        # Fails if any arm has a failed task or runner error. Fetch, publish and dispatch still run whenever this
        # step ran, so one bad arm or task never hides the arms that did generate.
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          NOTES: ${{ inputs.notes }}
        run: |
          modal run --detach modal_app.py --exp "$EXP" --split "$SPLIT" --tasks "$TASKS" \
            --runner "$RUNNER" --action-source "$ACTION_SOURCE" --num-shards "$NUM_SHARDS" --notes "$NOTES" \
            --extra="$ARMS_EXTRA" --arms="$ARMS"

      - name: Fetch arms from Modal
        if: ${{ !cancelled() && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        run: |
          mkdir -p runs
          for name in $ARM_EXPS; do
            modal volume get pwa-runs "/$name" runs/ --force || echo "::warning::$name: not fetched from the pwa-runs Volume"
          done

      - name: Publish arm videos (GitHub Releases run-EXP-aN)
        # Unscored clips, right after generation, so every arm can be watched before (or without) scoring.
        # The score-only experiment run later uploads to the same release with --clobber and, with the official
        # judge, replaces the notes. Each arm is guarded, so one failing arm never hides the others.
        if: ${{ !cancelled() && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          JUDGE: ${{ inputs.judge_model }}
        run: |
          repo="https://github.com/$GITHUB_REPOSITORY"
          shopt -s nullglob
          # pwa media writes "Unscored rollouts ..." notes (no report link) while the arm has no scores
          case "$STAGE:$JUDGE" in
            full:) next="If it generated any clips, a score-only \`experiment\` run is dispatched for it and replaces these notes once it scores them." ;;
            full:*) next="If it generated any clips, a score-only \`experiment\` run scores it with the screening judge \`$JUDGE\`; these notes are not updated." ;;
            *) next="This workflow ran with stage=$STAGE and does not score them." ;;
          esac
          publish_arm() {  # NAME IDX SPEC. Called under ||, where bash -e is off, so every command checks its status.
            local name="$1" idx="$2" spec="$3" tag="run-$1" out="$RUNNER_TEMP/media/$1" files mp4 tid
            pwa media "$name" --out "$out" --base-url "$repo/releases/download/$tag/" --release-url "$repo/releases/tag/$tag" || return 1
            files=("$out"/*.mp4 "$out"/*.jpg)
            if (( ${#files[@]} == 0 )); then echo "$name: no rollouts to publish"; return 0; fi
            { echo "Unscored clips from arm $idx of \`$EXP\` (\`$spec\`). $next"; echo; cat "$out/RELEASE_NOTES.md"; } > "$out/NOTES.md" || return 1
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber || return 1
            else
              gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Scenes: $name" \
                --notes-file "$out/NOTES.md" --latest=false || return 1
            fi
            for mp4 in "$out"/*.mp4; do
              tid=$(basename "$mp4" .mp4)
              echo "| $name | \`$spec\` | $tid | [mp4]($repo/releases/download/$tag/$tid.mp4) | [jpg]($repo/releases/download/$tag/$tid.jpg) |" >> "$GITHUB_STEP_SUMMARY"
            done
          }
          { echo "### Arm videos"; echo; echo "| Arm | Args | Task | Video | Poster |"; echo "|---|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          failed=()
          while read -r name idx spec <&3; do
            publish_arm "$name" "$idx" "$spec" || { echo "::warning::$name: publishing its videos failed"; failed+=("$name"); }
          done 3< "$RUNNER_TEMP/arms.txt"
          if (( ${#failed[@]} )); then { echo; echo "Not published: ${failed[*]}"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - name: Dispatch one score-only experiment run per arm
        # Every arm with at least one fetched mp4, also when Generate failed for another arm or task. An arm with
        # missing tasks is scored on what it has (its report lists the missing ones). Dispatched arms go in
        # dispatched.txt: from here on their experiment run owns their csv row.
        if: ${{ !cancelled() && inputs.stage == 'full' && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          PASSES: ${{ inputs.passes }}
          JUDGE: ${{ inputs.judge_model }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
          GPU: ${{ inputs.gpu }}
        run: |
          shopt -s nullglob
          : > "$RUNNER_TEMP/dispatched.txt"
          while read -r name idx spec <&3; do
            vids=(runs/"$name"/videos/*/*.mp4)
            if (( ${#vids[@]} == 0 )); then echo "::warning::$name: no videos, not dispatched for scoring"; continue; fi
            [[ "$spec" == base ]] && spec=""
            # extra only labels the run title here; a score-only run generates nothing
            gh workflow run experiment.yml --ref "$GITHUB_REF_NAME" -f exp="$name" -f stage=score-only \
              -f backend=modal -f split="$SPLIT" -f tasks="$TASKS" -f runner="$RUNNER" -f action_source="$ACTION_SOURCE" \
              -f passes="$PASSES" -f judge_model="$JUDGE" -f player_model="$PLAYER_MODEL_IN" -f gpu="$GPU" -f extra="$spec"
            echo "$name" >> "$RUNNER_TEMP/dispatched.txt"
            echo "dispatched score-only run for $name (arm $idx)"
            sleep 2
          done 3< "$RUNNER_TEMP/arms.txt"
          echo "Scoring: one \`experiment\` run per dispatched arm ($(xargs < "$RUNNER_TEMP/dispatched.txt")) in the Actions list." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark final status on main
        # Per arm. A dispatched arm is skipped: its score-only experiment run sets its row. Any other arm is
        # cancelled if the job was cancelled, generated if every task has an mp4 (`pwa failures` lists no missing
        # task), else failed. Only rows still running change.
        if: always()
        continue-on-error: true
        env:
          CANCELLED: ${{ job.status == 'cancelled' && '1' || '' }}
        run: |
          touch "$RUNNER_TEMP/dispatched.txt"
          .github/scripts/push_results.sh "results: $EXP arms final status" '
            for name in $ARM_EXPS; do
              grep -qxF "$name" "$RUNNER_TEMP/dispatched.txt" && continue
              n=$(python -m pwa.cli failures "$name" --json 2>/dev/null | python -c "import json, sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo x)
              if [[ -n "$CANCELLED" ]]; then status=cancelled; elif [[ "$n" == 0 ]]; then status=generated; else status=failed; fi
              python -m pwa.cli mark "$name" --status "$status" --into "$MAIN_DIR/results/experiments.csv"
            done'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arms-${{ inputs.exp }}
          path: runs/${{ inputs.exp }}-a*
          retention-days: 14
          if-no-files-found: ignore
