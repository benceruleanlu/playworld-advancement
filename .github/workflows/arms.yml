name: arms
# Several arms (runner arg strings) on one small task list, generated back to back in one Modal GPU container
# per shard (`pwa gen-arms`), so the model load and first-chunk warm-up are paid once. Arm i is an ordinary
# experiment named EXP-a<i>. After generation each arm's clips are published to a release run-EXP-a<i>
# (linked from the step summary), its scenes manifest goes to results/media/ on main for the site, and an
# `experiment` run with stage=score-only is dispatched per arm, which scores, reports, publishes scenes and
# records the csv row exactly like any other run.
# Manual: Actions tab -> arms -> Run workflow. Needs a runner with main(argv): lingbot_world2 or lingbot_world2_1p3b.
# warm=on generates on the deployed Modal app playworld-warm (warm_app.py, pwa/warm.py) instead of an ephemeral
# app, so a container that is still up from an earlier warm run skips the model load and first-step warm-up.
# Each warm container bills the GPU rate for up to warm_idle_minutes after its last call; warm=stop ends them now.
run-name: "${{ inputs.warm == 'stop' && 'warm stop' || format('arms {0} · {1} · {2} · {3} · {4}{5}{6}', inputs.exp, inputs.runner, inputs.tasks || inputs.split, inputs.action_source, inputs.arms, inputs.stage != 'full' && format(' · {0}', inputs.stage) || '', inputs.warm == 'on' && ' · warm' || '') }}"

on:
  workflow_dispatch:
    inputs:
      exp:
        description: Arm group name; arm i is experiment EXP-a<i> (new name per run)
        required: true
      arms:
        description: "'|'-separated runner arg strings, one per arm; an empty one or 'base' is the baseline, e.g. 'base | --lingbot-turn-cal --lingbot-player-hint'"
        required: true
      tasks:
        description: Comma-separated task IDs (overrides split)
        default: "GC005"
      split:
        type: choice
        options: [dev, heldout, all]
        default: dev
      runner:
        type: choice
        options: [lingbot_world2_1p3b, lingbot_world2]
        default: lingbot_world2_1p3b
      action_source:
        type: choice
        options: [dataset, agent, refined]
        default: agent
      gpu:
        description: Modal GPU type
        type: choice
        options: [H100, A100-80GB, L40S]
        default: H100
      cpu:
        description: "CPU cores requested per Modal GPU container (empty = Modal's default). CPU-side load and T5 work scale with it; see --lingbot-cpu-threads"
        default: ""
      num_shards:
        description: GPU containers; each runs every arm on its share of the tasks
        default: "1"
      stage:
        description: full = generate, publish clips, then dispatch one score-only experiment run per arm
        type: choice
        options: [full, gen-only]
        default: full
      passes:
        description: Verifier passes (passed to each score-only run)
        default: "2"
      judge_model:
        description: Screening judge for the score-only runs (see experiment.yml); empty = official judge
        default: ""
      notes:
        default: ""
      extra:
        description: Runner args for every arm, before the arm's own
        default: ""
      player_model:
        description: Player (agent) model for closed-loop runs; passed to the runner as --agent-model
        default: "gpt-6-luna"
      warm:
        description: "off = ephemeral app (default). on = deployed warm app; containers stay up warm_idle_minutes after the last call and bill the GPU the whole time. stop = terminate warm containers now (other inputs ignored)"
        type: choice
        options: ["off", "on", "stop"]
        default: "off"
      warm_idle_minutes:
        description: "warm=on: idle window per container before it scales down (1-20; a change redeploys, cold)"
        default: "10"
      warm_max_containers:
        description: "warm=on: max warm containers per runner (1-8; a change redeploys, cold)"
        default: "3"
      modal_account:
        description: "Whose Modal workspace runs and pays: NAME uses repo secrets MODAL_TOKEN_ID_NAME / MODAL_TOKEN_SECRET_NAME. Empty = your default (repo variable MODAL_ACCOUNT_<your GitHub login>), else the shared workspace; 'shared' forces the shared one."
        default: ""

concurrency:
  group: arms-${{ inputs.exp }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  EXP: ${{ inputs.exp }}
  ARMS: ${{ inputs.arms }}
  PLAYER_API_PROVIDER: ${{ vars.PLAYER_API_PROVIDER || 'openai' }}
  PLAYER_API_URL: ${{ vars.PLAYER_API_URL || 'https://api.openai.com/v1' }}
  PLAYER_MODEL: ${{ vars.PLAYER_MODEL || 'gpt-4.1-mini' }}
  PLAYER_API_KEY: ${{ secrets.PLAYER_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # Whose Modal workspace runs and pays for this job: the modal_account input, else the dispatcher's default
  # (repo variable MODAL_ACCOUNT_<GitHub login>), else the shared workspace (also: modal_account=shared).
  # A named account uses repo secrets MODAL_TOKEN_ID_<NAME> / MODAL_TOKEN_SECRET_<NAME> and never falls back.
  MODAL_ACCOUNT: ${{ inputs.modal_account != 'shared' && (inputs.modal_account || vars[format('MODAL_ACCOUNT_{0}', github.actor)]) || '' }}
  MODAL_TOKEN_ID: ${{ (inputs.modal_account != 'shared' && (inputs.modal_account || vars[format('MODAL_ACCOUNT_{0}', github.actor)]) || '') == '' && secrets.MODAL_TOKEN_ID || secrets[format('MODAL_TOKEN_ID_{0}', inputs.modal_account != 'shared' && (inputs.modal_account || vars[format('MODAL_ACCOUNT_{0}', github.actor)]) || '')] }}
  MODAL_TOKEN_SECRET: ${{ (inputs.modal_account != 'shared' && (inputs.modal_account || vars[format('MODAL_ACCOUNT_{0}', github.actor)]) || '') == '' && secrets.MODAL_TOKEN_SECRET || secrets[format('MODAL_TOKEN_SECRET_{0}', inputs.modal_account != 'shared' && (inputs.modal_account || vars[format('MODAL_ACCOUNT_{0}', github.actor)]) || '')] }}
  PWA_MODAL_GPU: ${{ inputs.gpu }}
  PWA_MODAL_CPU: ${{ inputs.cpu }}
  PWA_RUNNER: ${{ inputs.runner }}
  MODAL_VERSION: "1.6.4"  # warm path only: the version pwa/warm.py and warm_app.py were checked against

jobs:
  stop-warm:
    if: inputs.warm == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Stop the warm app
        run: |
          pip install -q "modal==$MODAL_VERSION"
          python -m pwa.warm stop
          echo "Stopped Modal app \`playworld-warm\` (warm containers terminated)." >> "$GITHUB_STEP_SUMMARY"

  run:
    if: inputs.warm != 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate names and list arms
        env:
          EXTRA: ${{ inputs.extra }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
          WARM: ${{ inputs.warm }}
          WARM_IDLE: ${{ inputs.warm_idle_minutes }}
          WARM_MAX: ${{ inputs.warm_max_containers }}
        run: |
          # Modal workspace: a named account must have its own token pair; it never falls back to the shared one.
          if [[ -n "$MODAL_ACCOUNT" ]]; then
            [[ "$MODAL_ACCOUNT" =~ ^[A-Za-z0-9_]+$ ]] || { echo "modal_account must match [A-Za-z0-9_]+ (it names repo secrets)" >&2; exit 2; }
            [[ -n "$MODAL_TOKEN_ID" && -n "$MODAL_TOKEN_SECRET" ]] || { echo "modal_account=$MODAL_ACCOUNT: repo secrets MODAL_TOKEN_ID_$MODAL_ACCOUNT / MODAL_TOKEN_SECRET_$MODAL_ACCOUNT are missing; add them with gh secret set. Not falling back to the shared workspace." >&2; exit 2; }
            echo "::notice title=Modal workspace::$MODAL_ACCOUNT (its own tokens; volumes, weights and the pwa secret are per workspace)"
          else
            echo "::notice title=Modal workspace::shared (repo secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET)"
          fi
          [[ "$EXP" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "exp must match [A-Za-z0-9._-]+" >&2; exit 2; }
          if [[ "$WARM" == on ]]; then
            [[ "$WARM_IDLE" =~ ^[0-9]+$ ]] && (( WARM_IDLE >= 1 && WARM_IDLE <= 20 )) || { echo "warm_idle_minutes must be 1-20" >&2; exit 2; }
            [[ "$WARM_MAX" =~ ^[0-9]+$ ]] && (( WARM_MAX >= 1 && WARM_MAX <= 8 )) || { echo "warm_max_containers must be 1-8" >&2; exit 2; }
          fi
          [[ "$EXTRA$ARMS" != *$'\n'* ]] || { echo "extra and arms must be one line" >&2; exit 2; }
          # The args every arm gets, computed once so the labels below match what gen-arms runs.
          if [[ "$ACTION_SOURCE" != "dataset" && "$EXTRA" != *"--agent-model"* ]]; then
            EXTRA="$EXTRA --agent-model $PLAYER_MODEL_IN"
          fi
          { echo "ARMS_EXTRA<<__PWA_EOF__"; echo "$EXTRA"; echo "__PWA_EOF__"; } >> "$GITHUB_ENV"
          # One "NAME I/N LABEL" line per arm (the names pwa gen-arms and modal_app.py use). LABEL is every arg the
          # arm runs with, shared extra first ("base" only if there are none). Fails here if an arm does not parse.
          python -m pwa.arms "$EXP" "$ARMS" "$EXTRA" > "$RUNNER_TEMP/arms.txt"
          cat "$RUNNER_TEMP/arms.txt"
          echo "ARM_EXPS=$(cut -d' ' -f1 "$RUNNER_TEMP/arms.txt" | xargs)" >> "$GITHUB_ENV"
      - name: Check player API before generation
        if: inputs.action_source != 'dataset'
        env:
          PLAYER_MODEL: ${{ inputs.player_model }}
        run: |
          [[ "$PLAYER_MODEL" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "player_model must match [A-Za-z0-9._:-]+" >&2; exit 2; }
          timeout 30s python -m adapters.common.agent_api
      - name: Install Python dependencies
        # warm=on pins the Modal client the warm path was checked against; warm=off keeps the unpinned install.
        env:
          WARM: ${{ inputs.warm }}
        run: |
          if [[ "$WARM" == on ]]; then modal_req="modal==$MODAL_VERSION"; else modal_req=modal; fi
          pip install -q "$modal_req" huggingface_hub -e .
      - name: Set up FFmpeg
        # pwa media (libx264, thumbnail, +faststart) uses the pinned static build from imageio-ffmpeg, as experiment.yml does.
        run: |
          pip install -q --only-binary=:all: imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version
          "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -hide_banner -encoders | grep ' libx264 ' >/dev/null || { echo "ffmpeg lacks libx264" >&2; exit 1; }
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - name: Refuse arm names already in the pwa-runs Volume
        # Before any csv row is touched. modal_app.py repeats this guard at launch (the authoritative check).
        run: |
          python -I - <<'EOF'
          import os, modal
          existing = {e.path.strip("/") for e in modal.Volume.from_name("pwa-runs", create_if_missing=True).listdir("/")}
          taken = [n for n in os.environ["ARM_EXPS"].split() if n in existing]
          if taken:
              raise SystemExit(f"already in the pwa-runs Volume: {' '.join(taken)}; pick a new exp")
          EOF
      - uses: actions/cache@v4
        with:
          path: data
          key: playworld-bench-v1
      - name: Dataset
        run: |
          [[ -d data/gc/images ]] || python -I -c "from huggingface_hub import snapshot_download; snapshot_download('jocelynd/playworld-bench', repo_type='dataset', local_dir='data')"

      - name: Mark arms running on main
        id: mark
        continue-on-error: true
        env:
          LABEL: ${{ inputs.tasks && 'custom' || inputs.split }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NOTES: ${{ inputs.notes }}
        run: |
          .github/scripts/push_results.sh "results: $EXP arms running" '
            while read -r name idx spec <&3; do
              python -m pwa.cli mark "$name" --status running --into "$MAIN_DIR/results/experiments.csv" \
                --split="$LABEL" --runner="$RUNNER" --action-source="$ACTION_SOURCE" \
                --notes="${NOTES:+$NOTES }[arm $idx of $EXP: $spec]"
            done 3< "$RUNNER_TEMP/arms.txt"'

      - name: Sync Modal secret
        run: |
          modal secret create pwa --force \
            PLAYER_API_PROVIDER="$PLAYER_API_PROVIDER" PLAYER_API_URL="$PLAYER_API_URL" \
            PLAYER_MODEL="$PLAYER_MODEL" PLAYER_API_KEY="$PLAYER_API_KEY" HF_TOKEN="$HF_TOKEN" >/dev/null

      - name: Prefetch LingBot weights on CPU
        run: modal run prefetch_lingbot.py --variant "${{ inputs.runner == 'lingbot_world2_1p3b' && '1.3b' || '14b' }}"

      - name: Generate all arms (Modal)
        id: gen
        # Fails if any arm has a failed task or runner error. Fetch, publish and dispatch still run after a failure,
        # so one bad arm or task never hides the arms that did generate, but only if generation started: modal_app.py
        # (or pwa.warm with warm=on) writes claimed.txt (the arm names it generates into) only after its overwrite
        # guard passed, and this step then sets output started=true. A rejected launch (reused name, bad args)
        # stops everything downstream. warm=on calls the deployed app playworld-warm instead of `modal run`; it
        # deploys warm_app.py first when this commit or the warm settings differ (that call starts cold) and
        # always when the checkout has uncommitted changes.
        env:
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          NOTES: ${{ inputs.notes }}
          WARM: ${{ inputs.warm }}
          PWA_WARM_IDLE_MIN: ${{ inputs.warm_idle_minutes }}
          PWA_WARM_MAX_CONTAINERS: ${{ inputs.warm_max_containers }}
          PWA_CLAIM_FILE: ${{ runner.temp }}/claimed.txt
          PWA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rm -f "$PWA_CLAIM_FILE"
          rc=0
          if [[ "$WARM" == on ]]; then
            [[ "$NUM_SHARDS" =~ ^[0-9]+$ ]] || { echo "num_shards must be a number" >&2; exit 2; }
            python -m pwa.warm run --exp "$EXP" --arms="$ARMS" --runner "$RUNNER" --action-source "$ACTION_SOURCE" \
              --tasks="$TASKS" --split="$SPLIT" --num-shards "$NUM_SHARDS" --notes="$NOTES" --extra="$ARMS_EXTRA" \
              --summary "$RUNNER_TEMP/warm.json" || rc=$?
          else
            modal run --detach modal_app.py --exp "$EXP" --split "$SPLIT" --tasks "$TASKS" \
              --runner "$RUNNER" --action-source "$ACTION_SOURCE" --num-shards "$NUM_SHARDS" --notes "$NOTES" \
              --extra="$ARMS_EXTRA" --arms="$ARMS" || rc=$?
          fi
          if [[ -s "$PWA_CLAIM_FILE" ]]; then echo "started=true" >> "$GITHUB_OUTPUT"
          else echo "::error::the launch was refused before generating anything; nothing is fetched or published"; fi
          exit "$rc"
      - name: Warm container summary
        if: always() && inputs.warm == 'on'
        continue-on-error: true
        env:
          IDLE: ${{ inputs.warm_idle_minutes }}
        run: |
          [[ -f "$RUNNER_TEMP/warm.json" ]] || exit 0
          python - "$RUNNER_TEMP/warm.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("### Warm containers\n")
          print(f"Deployed this run: {'yes (cold start)' if d['deployed'] else 'no'}; wall clock {d['wall_s']} s\n")
          print("| Shard | Container call | Warm | Pipe load at enter (s) | Call (s) | rc |\n|---|---|---|---|---|---|")
          for r in d["shards"]:
              print(f"| {r['shard']} | {r['call']} | {r['warm']} | {r['pipe_loaded_in_s']} | {r.get('seconds', '')} | {r['rc']} |")
          PY
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Idle warm containers bill the GPU for up to $IDLE min after their last call. Stop them now: run this workflow with warm=stop." >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch arms from Modal
        # Only arms this run claimed, and of those only ones whose meta.json carries this run's PWA_RUN_ID, go into
        # owned.txt, which publish and dispatch read. Anything else is deleted from runs/ again.
        if: ${{ !cancelled() && steps.gen.outputs.started == 'true' && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        env:
          PWA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p runs
          : > "$RUNNER_TEMP/owned.txt"
          while read -r name idx spec <&3; do
            if ! grep -qxF "$name" "$RUNNER_TEMP/claimed.txt"; then echo "::warning::$name: not claimed by this run"; continue; fi
            if ! modal volume get pwa-runs "/$name" runs/ --force; then echo "::warning::$name: not fetched from the pwa-runs Volume"; continue; fi
            if python -m pwa.arms --owned "$PWA_RUN_ID" "$name"; then
              echo "$name $idx $spec" >> "$RUNNER_TEMP/owned.txt"
            else
              echo "::warning::$name: its meta.json is not from this run ($PWA_RUN_ID); not published or scored"
              rm -rf "runs/$name"
            fi
          done 3< "$RUNNER_TEMP/arms.txt"
          cat "$RUNNER_TEMP/owned.txt"

      - name: Publish arm videos (GitHub Releases run-EXP-aN)
        # Unscored clips, right after generation, so every arm can be watched before (or without) scoring.
        # The score-only experiment run later uploads to the same release with --clobber and, with the official
        # judge, replaces the notes. Each arm is guarded, so one failing arm never hides the others. An arm whose
        # every upload succeeded gets media/NAME/.published (as publish_scenes.sh) and a line in published.txt,
        # which the next step reads to put its manifest on main.
        if: ${{ !cancelled() && steps.gen.outputs.started == 'true' && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          JUDGE: ${{ inputs.judge_model }}
        run: |
          repo="https://github.com/$GITHUB_REPOSITORY"
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          shopt -s nullglob
          : > "$RUNNER_TEMP/published.txt"
          # pwa media writes "Unscored rollouts ..." notes (no report link) while the arm has no scores
          case "$STAGE:$JUDGE" in
            full:) next="If it generated any clips, a score-only \`experiment\` run is dispatched for it and replaces these notes once it scores them." ;;
            full:*) next="If it generated any clips, a score-only \`experiment\` run scores it with the screening judge \`$JUDGE\`; these notes are not updated." ;;
            *) next="This workflow ran with stage=$STAGE and does not score them." ;;
          esac
          publish_arm() {  # NAME IDX SPEC. Called under ||, where bash -e is off, so every command checks its status.
            local name="$1" idx="$2" spec="$3" tag="run-$1" out="$RUNNER_TEMP/media/$1" files mp4 tid
            rm -f "$out/.published"
            # the manifest labels: not scored, capped if capped (pwa media), and the arm's args
            pwa media "$name" --out "$out" --base-url "$repo/releases/download/$tag/" --release-url "$repo/releases/tag/$tag" \
              --site-url "$site" --label "arm $idx of $EXP: $spec" || return 1
            files=("$out"/*.mp4 "$out"/*.jpg)
            if (( ${#files[@]} == 0 )); then echo "$name: no rollouts to publish"; return 0; fi
            { echo "Unscored clips from arm $idx of \`$EXP\` (\`$spec\`). $next"; echo; cat "$out/RELEASE_NOTES.md"; } > "$out/NOTES.md" || return 1
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber || return 1
            else
              gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Scenes: $name" \
                --notes-file "$out/NOTES.md" --latest=false || return 1
            fi
            touch "$out/.published" || return 1
            echo "$name $idx $spec" >> "$RUNNER_TEMP/published.txt" || return 1
            for mp4 in "$out"/*.mp4; do
              tid=$(basename "$mp4" .mp4)
              echo "| $name | \`$spec\` | $tid | [play](${site}?scenes=$name&scene=$tid#scenes) | [mp4]($repo/releases/download/$tag/$tid.mp4) | [jpg]($repo/releases/download/$tag/$tid.jpg) |" >> "$GITHUB_STEP_SUMMARY"
            done
          }
          { echo "### Arm videos"; echo; echo "**play** links go live once the next step puts the arm's manifest on main."; echo
            echo "| Arm | Args | Task | Site | Video | Poster |"; echo "|---|---|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          failed=()
          while read -r name idx spec <&3; do
            publish_arm "$name" "$idx" "$spec" || { echo "::warning::$name: publishing its videos failed"; failed+=("$name"); }
          done 3< "$RUNNER_TEMP/owned.txt"
          if (( ${#failed[@]} )); then { echo; echo "Not published: ${failed[*]}"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - name: Commit arm scenes to main
        # Every arm in published.txt (generated by this run, every clip uploaded) gets results/media/NAME.json and
        # an index entry the same way experiment.yml does it (scenes_to_main.sh -> pwa.media to-main, which never
        # replaces an official scored manifest), plus results/reports/NAME.md with its play links unless main
        # already has a report for it. Runs before the dispatch below, so with stage=full the score-only run's
        # scored manifest and report land after these and replace them (to-main lets scored replace unscored).
        # Then the summary gets per-task play links and arm-vs-arm compare links. Never fails the job.
        if: ${{ !cancelled() && steps.gen.outputs.started == 'true' && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        continue-on-error: true
        run: |
          touch "$RUNNER_TEMP/published.txt"
          [[ -s "$RUNNER_TEMP/published.txt" ]] || { echo "no arm published its clips; nothing to commit"; exit 0; }
          rc=0
          .github/scripts/push_results.sh "results: $EXP arm scenes" '
            mkdir -p "$MAIN_DIR/results/reports"
            while read -r name idx spec <&3; do
              SCENES_DIR="$RUNNER_TEMP/media/$name" EXP="$name" .github/scripts/scenes_to_main.sh \
                || { echo "::warning::$name: scenes manifest not committed"; continue; }
              rep="$MAIN_DIR/results/reports/$name.md"
              [[ -f "$rep" ]] || { echo "## $name (arm $idx of $EXP, generated, not scored)"; echo; echo "args \`$spec\`"; echo
                                    cat "$RUNNER_TEMP/media/$name/SCENES.md"; } > "$rep"
            done 3< "$RUNNER_TEMP/published.txt"' || rc=$?
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          mans=()
          while read -r name idx spec <&3; do mans+=("$RUNNER_TEMP/media/$name/$name.json"); done 3< "$RUNNER_TEMP/published.txt"
          { echo; python -m pwa.media arms-md "$site" "${mans[@]}"; } >> "$GITHUB_STEP_SUMMARY"
          if (( rc )); then
            echo "::warning::arm scenes were not committed to main, so the site links above do not work yet"
            { echo; echo "Not committed to main: the site links above do not work yet."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dispatch one score-only experiment run per arm
        # Every arm in owned.txt (generated by this run) with at least one mp4, also when Generate failed for another
        # arm or task. An arm with
        # missing tasks is scored on what it has (its report lists the missing ones). Dispatched arms go in
        # dispatched.txt: from here on their experiment run owns their csv row.
        if: ${{ !cancelled() && inputs.stage == 'full' && steps.gen.outputs.started == 'true' && (steps.gen.outcome == 'success' || steps.gen.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ inputs.split }}
          TASKS: ${{ inputs.tasks }}
          RUNNER: ${{ inputs.runner }}
          ACTION_SOURCE: ${{ inputs.action_source }}
          PASSES: ${{ inputs.passes }}
          JUDGE: ${{ inputs.judge_model }}
          PLAYER_MODEL_IN: ${{ inputs.player_model }}
          GPU: ${{ inputs.gpu }}
        run: |
          shopt -s nullglob
          : > "$RUNNER_TEMP/dispatched.txt"
          while read -r name idx spec <&3; do
            vids=(runs/"$name"/videos/*/*.mp4)
            if (( ${#vids[@]} == 0 )); then echo "::warning::$name: no videos, not dispatched for scoring"; continue; fi
            [[ "$spec" == base ]] && spec=""
            # extra only labels the run title here; a score-only run generates nothing
            gh workflow run experiment.yml --ref "$GITHUB_REF_NAME" -f exp="$name" -f stage=score-only \
              -f backend=modal -f split="$SPLIT" -f tasks="$TASKS" -f runner="$RUNNER" -f action_source="$ACTION_SOURCE" \
              -f passes="$PASSES" -f judge_model="$JUDGE" -f player_model="$PLAYER_MODEL_IN" -f gpu="$GPU" -f extra="$spec" \
              -f modal_account="${MODAL_ACCOUNT:-shared}"
            echo "$name" >> "$RUNNER_TEMP/dispatched.txt"
            echo "dispatched score-only run for $name (arm $idx)"
            sleep 2
          done 3< "$RUNNER_TEMP/owned.txt"
          echo "Scoring: one \`experiment\` run per dispatched arm ($(xargs < "$RUNNER_TEMP/dispatched.txt")) in the Actions list." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark final status on main
        # Per arm. A dispatched arm is skipped: its score-only experiment run sets its row. Any other arm is
        # cancelled if the job was cancelled, generated if every task has an mp4 (`pwa failures` lists no missing
        # task), else failed. Only rows still running change. Skipped if the running markers never ran (e.g. the
        # Volume name check refused a reused name), so an older run's rows are never touched.
        if: ${{ always() && (steps.mark.outcome == 'success' || steps.mark.outcome == 'failure') }}
        continue-on-error: true
        env:
          CANCELLED: ${{ job.status == 'cancelled' && '1' || '' }}
        run: |
          touch "$RUNNER_TEMP/dispatched.txt"
          .github/scripts/push_results.sh "results: $EXP arms final status" '
            for name in $ARM_EXPS; do
              grep -qxF "$name" "$RUNNER_TEMP/dispatched.txt" && continue
              n=$(python -m pwa.cli failures "$name" --json 2>/dev/null | python -c "import json, sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo x)
              if [[ -n "$CANCELLED" ]]; then status=cancelled; elif [[ "$n" == 0 ]]; then status=generated; else status=failed; fi
              python -m pwa.cli mark "$name" --status "$status" --into "$MAIN_DIR/results/experiments.csv"
            done'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arms-${{ inputs.exp }}
          path: runs/${{ inputs.exp }}-a*
          retention-days: 14
          if-no-files-found: ignore
