name: pages

# Builds the Astro site in site/ and deploys site/dist (plus a bundled copy of
# results/experiments.csv as the fallback) to GitHub Pages.
# The page fetches the live CSV from main at view time; the bundled copy is only a fallback.
# The Slidev deck in slides/ is built separately and served under /slides/.
# One-time admin setting: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "slides/**", "results/experiments.csv", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            slides/package-lock.json
      - name: Build site (bundles the fallback CSV)
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          mkdir -p public
          cp ../results/experiments.csv public/experiments.csv
          if [ -d ../results/media ]; then cp -r ../results/media public/media; fi  # fallback for the Scenes section
          npm run build
      - name: Build slides into site/dist/slides
        # A broken deck must not block results and site deploys: on failure /slides/ is absent from this deploy.
        continue-on-error: true
        working-directory: slides
        run: |
          npm ci --no-audit --no-fund
          npx slidev build --base /playworld-advancement/slides/
          rm -rf ../site/dist/slides
          cp -r dist ../site/dist/slides
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
