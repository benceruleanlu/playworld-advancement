[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa"
version = "0.1.0"
description = "PlayWorld advancement iteration CLI: generate, score, report, compare"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pwa = "pwa.cli:main"

[tool.setuptools.packages.find]
include = ["pwa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
